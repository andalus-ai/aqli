# ============================================================================
# Aqli Optimization Plugins Configuration
# ============================================================================
# 
# All optimization plugins can be enabled/disabled individually.
# By default, ALL optimizations are ENABLED for maximum performance.
#
# Usage: Copy this to your application.properties and modify as needed.
# ============================================================================

# ──────────────────────────────────────────────────────────────────────────
# Core Optimizations (Highest Impact)
# ──────────────────────────────────────────────────────────────────────────

## PagedAttention - VLLM-style paged KV cache (10-24x throughput improvement)
aqli.optimizations.paged-attention.enabled=true
aqli.optimizations.paged-attention.priority=10
aqli.optimizations.paged-attention.blockSize=16
aqli.optimizations.paged-attention.totalBlocks=2048

## KV Cache - Multi-turn conversation support
aqli.optimizations.kv-cache.enabled=true
aqli.optimizations.kv-cache.priority=20
aqli.optimizations.kv-cache.evictionPolicy=LRU
aqli.optimizations.kv-cache.maxSequenceLength=32768

## Continuous Batching - Dynamic batch sizing
aqli.optimizations.continuous-batching.enabled=true
aqli.optimizations.continuous-batching.priority=15
aqli.optimizations.continuous-batching.maxBatchSize=256
aqli.optimizations.continuous-batching.scheduleIntervalMs=10

# ──────────────────────────────────────────────────────────────────────────
# Attention Optimizations
# ──────────────────────────────────────────────────────────────────────────

## FlashAttention - Memory-efficient attention
aqli.optimizations.flash-attention.enabled=true
aqli.optimizations.flash-attention.priority=5
aqli.optimizations.flash-attention.deviceFilter=cuda,metal,rocm
aqli.optimizations.flash-attention.minSeqLen=512

## FlashAttention-3 - Hopper+ GPUs only (2-3x faster)
aqli.optimizations.fa3.enabled=true
aqli.optimizations.fa3.priority=3
aqli.optimizations.fa3.deviceFilter=cuda
aqli.optimizations.fa3.minComputeCapability=90

## FlashAttention-4 - Next-gen (Blackwell/Metal)
aqli.optimizations.fa4.enabled=true
aqli.optimizations.fa4.priority=2
aqli.optimizations.fa4.deviceFilter=cuda,metal
aqli.optimizations.fa4.minComputeCapability=100

## Hybrid Attention - Mix of standard and optimized
aqli.optimizations.hybrid-attention.enabled=true
aqli.optimizations.hybrid-attention.priority=30
aqli.optimizations.hybrid-attention.deviceFilter=cuda

# ──────────────────────────────────────────────────────────────────────────
# Memory Optimizations
# ──────────────────────────────────────────────────────────────────────────

## Prompt Cache - Cache system prompts (5-10x speedup for repeated prompts)
aqli.optimizations.prompt-cache.enabled=true
aqli.optimizations.prompt-cache.priority=25
aqli.optimizations.prompt-cache.maxPrompts=1000
aqli.optimizations.prompt-cache.ttlMinutes=60

## EvicPress - KV cache compression
aqli.optimizations.evicpress.enabled=true
aqli.optimizations.evicpress.priority=35
aqli.optimizations.evicpress.deviceFilter=cuda,metal

## Weight Offload - Offload weights to CPU for large models
aqli.optimizations.weight-offload.enabled=false
aqli.optimizations.weight-offload.priority=55
aqli.optimizations.weight-offload.offloadTo=cpu

# ──────────────────────────────────────────────────────────────────────────
# Performance Modes
# ──────────────────────────────────────────────────────────────────────────

## Performance Mode - Tuned for latency or throughput
aqli.optimizations.perf-mode.enabled=true
aqli.optimizations.perf-mode.priority=40
aqli.optimizations.perf-mode.mode=balanced
# Options: latency, throughput, balanced

## Prefill-Decode Split - Separate kernels for prefill and decode
aqli.optimizations.prefill-decode.enabled=true
aqli.optimizations.prefill-decode.priority=45
aqli.optimizations.prefill-decode.deviceFilter=cuda

# ──────────────────────────────────────────────────────────────────────────
# Scheduling Optimizations
# ──────────────────────────────────────────────────────────────────────────

## Wait Scheduler - Async scheduling optimization
aqli.optimizations.wait-scheduler.enabled=true
aqli.optimizations.wait-scheduler.priority=50

# ──────────────────────────────────────────────────────────────────────────
# Training/Fine-tuning Optimizations
# ──────────────────────────────────────────────────────────────────────────

## QLoRA - Quantized Low-Rank Adaptation
aqli.optimizations.qlora.enabled=false
aqli.optimizations.qlora.priority=60
aqli.optimizations.qlora.rank=16
aqli.optimizations.qlora.alpha=32

## Elastic Expert Parallel - Distributed training
aqli.optimizations.elastic-ep.enabled=false
aqli.optimizations.elastic-ep.priority=65
aqli.optimizations.elastic-ep.deviceFilter=cuda,rocm
