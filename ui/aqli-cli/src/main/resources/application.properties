quarkus.log.category."io.quarkus".level=WARN
quarkus.log.category."tech.kayys.aqli.inference.libtorch".level=WARN

# Enable DEBUG logging for SafeTensor device placement (file-only, console suppressed)
quarkus.log.category."tech.kayys.aqli.safetensor.engine.generation.DirectInferenceEngine".level=DEBUG
quarkus.log.category."tech.kayys.aqli.cli.commands.ChatCommand".level=WARN
