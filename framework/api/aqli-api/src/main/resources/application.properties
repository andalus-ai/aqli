# Simple demo settings
# Allowed keys are persisted in aqli.server.keys-file; seed contains 'community'
aqli.server.allowed-api-keys=community
aqli.server.admin-secret=admin-secret
aqli.server.keys-file=./data/keys.json
# Enable metrics
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
# Quarkus dev port
# Quarkus dev port
quarkus.http.port=9131

# Centralized Logging Configuration
quarkus.log.file.enable=true
quarkus.log.file.path=${user.home}/.aqli/logs/aqli.json.log
quarkus.log.file.json=true
quarkus.log.console.json=false
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=5

